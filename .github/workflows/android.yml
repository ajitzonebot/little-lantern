name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and debug build
        run: ./gradlew --no-daemon test assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: little-lantern-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      # Direct phone download link, refreshed on every push:
      # https://github.com/<owner>/<repo>/releases/download/latest/little-lantern.apk
      - name: Publish APK to the "latest" release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk little-lantern.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest little-lantern.apk \
            --target "$GITHUB_SHA" \
            --title "Latest test build" \
            --notes "Debug build from ${GITHUB_REF_NAME} at ${GITHUB_SHA::7}. Install on the dedicated device, then follow docs/SETUP.md."
